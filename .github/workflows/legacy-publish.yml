# One-time migration: publish @enterstellar-ai/* legacy proxy shims (with READMEs).
#
# Manual trigger only — do NOT run on every push.
# Requires NPM_TOKEN with publish access to @enterstellar-ai/*.
#
# Current proxy version is defined in scripts/generate-legacy-proxies.mjs (LEGACY_VERSION).

name: 'Migration: Publish legacy proxies'

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish @enterstellar-ai/* proxies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build canonical packages (proxy dependencies)
        run: pnpm turbo run build --filter='./legacy/*'...

      - name: Publish legacy proxies
        run: pnpm legacy:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
