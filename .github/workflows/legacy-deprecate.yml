# One-time migration: deprecate original @enterstellar-ai/*@0.1.0 releases.
#
# Run AFTER legacy proxies are published. Does NOT deprecate proxy versions.
# Manual trigger only.

name: 'Migration: Deprecate @enterstellar-ai/*@0.1.0'

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deprecate:
    name: Deprecate original @enterstellar-ai/*@0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Deprecate @enterstellar-ai/*@0.1.0
        run: node scripts/deprecate-legacy-scope.mjs --exec
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
